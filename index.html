me":"audio/mp4","size":2960987},"7":{"id":"709792599f83d6c8e09fd4bf584014af","dur":47.89,"mime":"audio/mp4","size":1542953},"8":{"id":"ecc9dfd7de7eb2e7db3583f15e58a277","dur":59.2,"mime":"audio/mp4","size":1907015},"9":{"id":"262f028129a5992f541ba0705838823f","dur":63.76,"mime":"audio/mp4","size":2054025}},"stories":[{"id":6,"title":"داستان کیومرث","art":"n15","sum":"کیومرث نخستین پادشاه جهان بود و در دشت و کوه زندگی می‌کرد. وقتی دیو سرما آمد، به جای نگرانی راهی پیدا کرد و برای خودش خانه‌ای گرم ساخت.","text":"داستان کیومرث\nبه نام خداوند جان و خرد\nدرود بر همه کودکان دانا و خردمند ایران زمین\nبچه‌ها ما می‌خواهیم با هم داستان‌های زیبایی از کتاب شاهنامه بشنویم.\nیکی از اون داستان‌ها، داستان پادشاهی به نام کیومرثه.\nکیومرث نخستین پادشاه جهان بود. او خونه و قصری نداشت و در دشت و کوه زندگی می‌کرد.\n\nکیومرث شد بر جهان کدخدای\nنخستین به کوه اندرون ساخت جای\n\nیه روز دیو سرما از پشت کوه‌ها سرک کشید و کیومرث رو دید که خوشحال و شاد در دشت و کنار حیواناتی که در اونجا بودند، زندگی می‌کنه.\nدیو سرما خواست که کیومرث رو اذیت کنه، بیاد و بهش سرما بده. اما کیومرث وقتی دید سرما اومده، به جای غصه خوردن و نگران شدن، تصمیم گرفت که یه راه حل پیدا کنه، بچه‌ها.\n\nپس فکر کرد و فکر کرد و فهمید که بهتره یه خونه بسازه که توش گرم و نرم باشه.\nبچه‌ها کیومرث رفت تو خونه‌اش و دیو سرما نتونست کاری کنه و دوباره برگشت پشت کوه‌ها.","cards":[{"q":"نخستین پادشاه جهان کیست؟","a":"کیومرث","e":"او در دشت و کوه زندگی می‌کرد و نخستین کسی بود که برای خودش در کوه جایی ساخت.","img":"n8"},{"q":"دیو سرما با کیومرث چه کرد؟","a":"نتوانست کاری کند","e":"دیو سرما آمد تا کیومرث را اذیت کند، اما کیومرث خانه‌ای گرم ساخت و دیو دوباره پشت کوه‌ها برگشت.","img":"n1"}]},{"id":7,"title":"طهمورث دیوبند","art":"n16","sum":"طهمورث، پادشاهی که با دیوها جنگید و آن‌ها را شکست داد. دیوها به او خواندن و نوشتن آموختند و او دانا شد.","text":"روزی روزگاری، یه پادشاهی بود به نام طهمورث دیوبند. یعنی پادشاهی که با دیوها می‌جنگید. بچه‌ها، دیوها در داستان‌های قدیمی، موجوداتی خیالی بودند که شکل‌های عجیب و غریبی داشتند و کارهای بدی انجام می‌دادند.\nطهمورث دیوبند، دیوها را شکست داد و از آن‌ها خواست که به او خواندن و نوشتن یاد بدهند.\n\nنبشتن به خسرو بیاموختند\nدلش را به دانش برافروختند\n\nیعنی طهمورث خوندن و نوشتن یاد گرفت و دانا شد.","cards":[{"q":"لقب طهمورث چه بود؟","a":"دیوبند","e":"او پادشاهی بود که با دیوها می‌جنگید و آن‌ها را شکست داد.","img":"n4"},{"q":"طهمورث از دیوها چه یاد گرفت؟","a":"خواندن و نوشتن","e":"دیوها به او نوشتن آموختند و طهمورث با دانش، دلش روشن شد.","img":"n19"}]},{"id":8,"title":"جمشید و نوروز","art":"n7","sum":"جمشید تختی از طلا ساخت و با کمک دیوها به آسمان پرواز کرد. مردم از بازگشتش شاد شدند و جشنی گرفتند که نامش را نوروز گذاشتند.","text":"در شاهنامه پادشاهی هست به نام جمشید. جمشید خیلی دوست داشت پرواز کند و آسمان رو از نزدیک ببیند. به همین خاطر، دستور داد تختی از طلا برایش بسازند. جمشید روی تخت نشست و با کمک دیوها به آسمان پرواز کرد. تخت جمشید در آسمان مثل خورشید می‌درخشید.\n\nوقتی جمشید دوباره به زمین برگشت، مردم از دیدنش خیلی خوشحال شدند. برای جمشید جشن و مهمانی گرفتند و نام جشنشان را گذاشتند «نوروز».\n\nبه جمشید بر گوهر افشاندند\nمر آن روز را روز نو خواندند","cards":[{"q":"جمشید با تخت زرین چه کرد؟","a":"به آسمان پرواز کرد","e":"با کمک دیوها پرواز کرد و تختش در آسمان مثل خورشید می‌درخشید.","img":"n18"},{"q":"نوروز از کجا آمد؟","a":"از جشن جمشید","e":"وقتی جمشید به زمین برگشت، مردم جشن گرفتند و آن روز را «روز نو» نامیدند.","img":"n22"}]},{"id":9,"title":"غرور جمشید","art":"n21","sum":"جمشید در آغاز مهربان بود و برای مردم خانه، لباس و درمانگاه می‌ساخت؛ اما کم‌کم مغرور شد و فقط به خودش فکر کرد. به نظر شما رفتار او درست بود؟","text":"جمشید، در ابتدا خیلی مهربان بود و کارهای خیلی خوبی برای مردم انجام می‌داد. مثلا برای آن‌ها خانه‌های قشنگ می‌ساخت، لباس‌ها و عطرهای خوشبو درست می‌کرد، درمانگاه و بیمارستان می‌ساخت تا وقتی کسی مریض می‌شد، پیش دکتر برود.\nاما بچه‌ها، کم‌کم جمشید تغییر کرد، با خودش گفت: همه این چیزها، مال من است. من هر کاری دلم بخواهد می‌توانم انجام دهم.\nجمشید آن‌قدر مغرور شد که دیگر به کسی جز خودش فکر نمی‌کرد.\n\nیکایک به تخت مهی بنگرید\nبه گیتی جز از خویشتن را ندید\n\nیعنی جمشید فکر می‌کرد فقط خودش مهم است. به نظر شما جمشید رفتار درستی داشت؟","cards":[{"q":"چرا جمشید مغرور شد؟","a":"فقط به خودش فکر می‌کرد","e":"او با خودش گفت همه‌ی این‌ها مال من است. به نظر شما رفتار او درست بود؟","img":"n21"}]}]}</script><script src="app.js"></script>
